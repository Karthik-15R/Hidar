  secondary_roles: "Computer Architect, Microarchitecture Engineer, DFT Engineer, STA Engineer"
  bonus_domain: "Computer Architecture (CPU, GPU, Cache, Coherency, Interconnect, NoC, RISC-V, SoC)"
  experience: "0-2 years (2026 graduate / fresher / entry-level / Engineer I)"
