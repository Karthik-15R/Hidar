xray_queries:
  # 1. LINKEDIN DIRECT HIRING & TEAM EXPANSION (INDIA)
  - 'site:linkedin.com/posts ("RTL" OR "ASIC Design" OR "Digital Design" OR "Design Verification" OR "Verification Engineer") ("hiring" OR "opening" OR "openings" OR "exciting opportunities" OR "expanding our team" OR "expanding my team" OR "join us" OR "join my team" OR "join our team") ("India" OR "Bengaluru" OR "Hyderabad" OR "Chennai" OR "Noida" OR "Pune") -"open to work"'

  # 2. LINKEDIN REFERRALS, REQ IDs & RESUME CALLOUTS (INDIA)
  - 'site:linkedin.com/posts ("RTL" OR "ASIC Design" OR "Digital Design" OR "Design Verification" OR "Verification Engineer") ("referral" OR "referring" OR "refer" OR "req id" OR "job id" OR "looking for" OR "share your resume" OR "send your resume" OR "dm me" OR "apply") ("India" OR "Bengaluru" OR "Hyderabad" OR "Chennai" OR "Noida" OR "Pune") -"open to work"'

