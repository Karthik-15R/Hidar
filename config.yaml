  # 5. X / TWITTER HIRING MANAGERS & REFERRALS
  - 'site:x.com ("RTL" OR "ASIC Design" OR "Digital Design" OR "Design Verification" OR "Verification") ("hiring" OR "referral" OR "referring" OR "opening" OR "looking for" OR "expanding" OR "join us" OR "req id") ("India" OR "Bengaluru" OR "Hyderabad" OR "Chennai")'

