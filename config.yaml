  - 'site:linkedin.com/posts ("RTL" OR "ASIC" OR "Digital Design" OR "Verification" OR "DV") ("0-2" OR "1-2" OR "fresher" OR "freshers" OR "graduate" OR "new grad" OR "2026" OR "entry level" OR "intern") ("India" OR "Bengaluru" OR "Hyderabad" OR "Chennai" OR "Noida" OR "Pune") -"open to work"'

