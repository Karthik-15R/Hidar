name: Hiring Radar 24/7

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pyyaml google-genai

      - name: Run Hiring Radar
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python agent.py

      - name: Save seen_posts.db
        run: |
          git config --global user.name "HiringRadarBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add seen_posts.db
          git diff --staged --quiet || git commit -m "Update seen posts"
          git push
